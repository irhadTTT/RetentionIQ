services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retentioniq-api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: retentioniq-frontend
    ports:
      - "5173:80"
    depends_on:
      - api